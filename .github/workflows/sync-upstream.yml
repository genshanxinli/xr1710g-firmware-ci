name: Sync Upstream Tracking

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  # actions:read is required for the cache restores below; with an
  # explicit permissions block, unlisted scopes default to none.
  actions: read
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SYNC_TREE: ${{ runner.temp }}/openwrt-sync
    steps:
      - name: Checkout CI repo
        uses: actions/checkout@v4

      - name: Check upstream SHAs
        id: check
        run: |
          if bash scripts/check-upstream.sh; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Clone locked fanboy base into sync tree
        id: clone
        if: steps.check.outputs.changed == 'true'
        run: |
          mkdir -p ${{ env.SYNC_TREE }}
          bash scripts/clone-base.sh ${{ env.SYNC_TREE }}
          echo "upstream_commit=$(git -C ${{ env.SYNC_TREE }} rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Prepare sync tree cache paths
        if: steps.check.outputs.changed == 'true'
        run: |
          mkdir -p ${{ env.SYNC_TREE }}/dl \
            ${{ env.SYNC_TREE }}/staging_dir \
            ${{ env.SYNC_TREE }}/build_dir/host

      - name: Restore dl cache
        id: cache-dl
        if: steps.check.outputs.changed == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.SYNC_TREE }}/dl
          key: dl-fanboy-${{ steps.clone.outputs.upstream_commit }}
          restore-keys: dl-fanboy-

      - name: Restore toolchain cache
        id: cache-tc
        if: steps.check.outputs.changed == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.SYNC_TREE }}/staging_dir
            ${{ env.SYNC_TREE }}/build_dir/host
            ${{ env.SYNC_TREE }}/build_dir/toolchain-*
          key: toolchain-fanboy-${{ steps.clone.outputs.upstream_commit }}
          restore-keys: toolchain-fanboy-

      - name: Refresh overlays and validate
        id: refresh
        if: steps.check.outputs.changed == 'true'
        continue-on-error: true
        run: |
          bash scripts/refresh-upstream.sh
          FLAGS="--tree-dir=${{ env.SYNC_TREE }}"
          if [ "${{ steps.cache-tc.outputs.cache-hit }}" = "true" ]; then
            FLAGS="$FLAGS --toolchain-cached"
          fi
          bash scripts/validate-overlay.sh $FLAGS

      - name: Create conflict issue
        if: steps.check.outputs.changed == 'true' && steps.refresh.outcome == 'failure'
        run: |
          cat docs/upstream-changes.md docs/preflight-report.md > /tmp/conflict-body.md 2>/dev/null || true
          gh issue create \
            --title "Upstream overlay refresh conflict" \
            --body-file /tmp/conflict-body.md \
            || true

      - name: Commit and open summary PR
        id: commit-pr
        if: steps.check.outputs.changed == 'true' && steps.refresh.outcome == 'success'
        run: |
          set +e
          (
            set -euxo pipefail
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -B upstream-sync
            git add overlay patches candidates upstream.lock.json docs
            git commit -m "sync: refresh upstream tracking set" || true
            git push -f origin upstream-sync
            cat docs/upstream-changes.md docs/preflight-report.md > /tmp/pr-body.md 2>/dev/null || true
            if gh pr view upstream-sync --json number -q .number >/dev/null 2>&1; then
              gh pr edit upstream-sync --body-file /tmp/pr-body.md
            else
              gh pr create \
                --base main \
                --head upstream-sync \
                --title "Upstream tracking refresh" \
                --body-file /tmp/pr-body.md
            fi
          ) > /tmp/sync-pr.log 2>&1
          status=$?
          cat /tmp/sync-pr.log
          exit $status

      - name: Print sync failure log
        if: failure()
        run: |
          echo "::error::Sync Upstream PR step failed; see sync-upstream-failure artifact"
          cat /tmp/sync-pr.log || true

      - name: Upload sync failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sync-upstream-failure
          path: |
            /tmp/sync-pr.log
            docs/upstream-changes.md
            docs/preflight-report.md
          if-no-files-found: warn
          retention-days: 7
