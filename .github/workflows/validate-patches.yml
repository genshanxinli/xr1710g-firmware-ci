name: Validate Patches

on:
  pull_request:
    paths:
      - 'apply-patches.sh'
      - 'candidates/**'
      - 'defconfig'
      - 'overlay/**'
      - 'patches/**'
      - 'scripts/**'
      - 'upstream.lock.json'
      - 'upstreams.yml'
      - 'supersede.list'
      - '.github/workflows/validate-patches.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: Validation mode
        required: false
        default: prepare
        type: choice
        options:
          - prepare
          - compile
      include_candidates:
        description: Include candidates
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_DIR: openwrt
  CI_REPO: ci-repo
  GLASS_REPO: rchen14b/luci-theme-glass
  GLASS_REF: v1.1.6
  CCACHE_MAXSIZE: 4G
  CCACHE_COMPRESS: "1"

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      candidates: ${{ steps.filter.outputs.candidates }}
    steps:
      - name: Checkout CI repo
        uses: actions/checkout@v4
      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            candidates:
              - 'candidates/**'

  static:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout CI repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check shell scripts
        run: |
          bash -n apply-patches.sh scripts/*.sh
          git diff --check origin/main...HEAD -- . ':(exclude)*.patch'

  baseline-prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    # actions:write for cache save/delete; an explicit permissions block
    # resets unlisted scopes to none, so contents:read must be listed too.
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout CI repo
        uses: actions/checkout@v4
        with:
          path: ci-repo
      - name: Compute CI content hash
        id: ci-hash
        run: |
          echo "ci_hash=$(bash ${{ env.CI_REPO }}/scripts/ci-content-hash.sh ${{ env.CI_REPO }})" >> $GITHUB_OUTPUT
          echo "build_date=$(date -u +%Y%m%d)" >> $GITHUB_OUTPUT
      - name: Clone locked fanboy ubi2-oc base
        id: clone
        run: |
          bash ${{ env.CI_REPO }}/scripts/clone-base.sh ${{ env.BUILD_DIR }}
          echo "upstream_commit=$(git -C ${{ env.BUILD_DIR }} rev-parse HEAD)" >> $GITHUB_OUTPUT
      - name: Prepare cache paths
        run: |
          mkdir -p ${{ env.BUILD_DIR }}/dl ${{ env.BUILD_DIR }}/feeds ${{ env.BUILD_DIR }}/.ccache
      - name: Restore dl cache
        id: cache-dl
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.BUILD_DIR }}/dl
          key: dl-fanboy-${{ steps.clone.outputs.upstream_commit }}
          restore-keys: dl-fanboy-
      - name: Restore feeds cache
        id: cache-feeds
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.BUILD_DIR }}/feeds
          # Date-suffixed to match build.yml: an exact hit only skips the
          # feeds update for same-day runs, keeping the snapshot fresh.
          key: feeds-fanboy-${{ steps.clone.outputs.upstream_commit }}-${{ steps.ci-hash.outputs.build_date }}
          restore-keys: |
            feeds-fanboy-${{ steps.clone.outputs.upstream_commit }}-
            feeds-fanboy-
      - name: Restore toolchain cache
        id: cache-tc
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.BUILD_DIR }}/staging_dir
            ${{ env.BUILD_DIR }}/build_dir/host
            ${{ env.BUILD_DIR }}/build_dir/toolchain-*
          key: toolchain-fanboy-${{ steps.clone.outputs.upstream_commit }}
          restore-keys: toolchain-fanboy-
      - name: Restore ccache
        id: cache-ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.BUILD_DIR }}/.ccache
          key: ccache-fanboy-${{ steps.clone.outputs.upstream_commit }}-${{ steps.ci-hash.outputs.ci_hash }}
          restore-keys: |
            ccache-fanboy-${{ steps.clone.outputs.upstream_commit }}-
            ccache-fanboy-
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential ninja-build meson \
            libelf-dev libssl-dev libncurses-dev zlib1g-dev gawk flex bison gettext \
            unzip file rsync git subversion swig ecj libtool-bin autoconf automake
      - name: Set up validation tree
        run: |
          FEEDS_FLAG=""
          if [ "${{ steps.cache-feeds.outputs.cache-hit }}" = "true" ]; then
            FEEDS_FLAG="--skip-feeds-update"
          fi
          bash ${{ env.CI_REPO }}/scripts/setup-validate-tree.sh \
            --existing $FEEDS_FLAG ${{ env.BUILD_DIR }} ${{ env.CI_REPO }}
      - name: Download sources
        run: |
          cd ${{ env.BUILD_DIR }}
          make download -j$(nproc)
      - name: Save dl cache
        continue-on-error: true
        if: success() && steps.cache-dl.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.BUILD_DIR }}/dl
          key: dl-fanboy-${{ steps.clone.outputs.upstream_commit }}
      - name: Build tools + toolchain
        if: steps.cache-tc.outputs.cache-hit != 'true'
        run: |
          cd ${{ env.BUILD_DIR }}
          make tools/install toolchain/install -j$(nproc) V=s 2>&1 | tail -30
      - name: Save toolchain cache
        continue-on-error: true
        if: success() && steps.cache-tc.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.BUILD_DIR }}/staging_dir
            ${{ env.BUILD_DIR }}/build_dir/host
            ${{ env.BUILD_DIR }}/build_dir/toolchain-*
          key: toolchain-fanboy-${{ steps.clone.outputs.upstream_commit }}
      - name: Run preflight
        run: |
          bash ${{ env.CI_REPO }}/scripts/preflight-validate.sh \
            ${{ env.BUILD_DIR }} --mode=${{ inputs.mode || 'prepare' }} --skip-apply
      - name: Check ccache cache
        id: check-ccache
        if: success() && steps.cache-ccache.outputs.cache-hit != 'true'
        run: |
          set +e
          if [ -d "${{ env.BUILD_DIR }}/.ccache" ] && [ -n "$(find "${{ env.BUILD_DIR }}/.ccache" -mindepth 1 -print -quit)" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Save ccache
        continue-on-error: true
        if: success() && steps.cache-ccache.outputs.cache-hit != 'true' && steps.check-ccache.outputs.exists == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.BUILD_DIR }}/.ccache
          key: ccache-fanboy-${{ steps.clone.outputs.upstream_commit }}-${{ steps.ci-hash.outputs.ci_hash }}
      - name: Prune stale caches
        if: always()
        continue-on-error: true
        run: |
          bash ${{ env.CI_REPO }}/scripts/prune-caches.sh
      - name: Upload preflight report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-preflight-report
          path: ${{ env.CI_REPO }}/docs/preflight-report.md
          if-no-files-found: warn
          retention-days: 7

  candidate-prepare:
    runs-on: ubuntu-24.04
    if: |
      github.event_name == 'workflow_dispatch' && inputs.include_candidates == 'true'
      || needs.changes.outputs.candidates == 'true'
    needs: changes
    continue-on-error: true
    timeout-minutes: 180
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout CI repo
        uses: actions/checkout@v4
        with:
          path: ci-repo
      - name: Compute CI content hash
        id: ci-hash
        run: |
          echo "ci_hash=$(bash ${{ env.CI_REPO }}/scripts/ci-content-hash.sh ${{ env.CI_REPO }})" >> $GITHUB_OUTPUT
          echo "build_date=$(date -u +%Y%m%d)" >> $GITHUB_OUTPUT
      - name: Clone locked fanboy ubi2-oc base
        id: clone
        run: |
          bash ${{ env.CI_REPO }}/scripts/clone-base.sh ${{ env.BUILD_DIR }}
          echo "upstream_commit=$(git -C ${{ env.BUILD_DIR }} rev-parse HEAD)" >> $GITHUB_OUTPUT
      - name: Prepare cache paths
        run: |
          mkdir -p ${{ env.BUILD_DIR }}/dl ${{ env.BUILD_DIR }}/feeds ${{ env.BUILD_DIR }}/.ccache
      - name: Restore dl cache
        id: cache-dl
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.BUILD_DIR }}/dl
          key: dl-fanboy-${{ steps.clone.outputs.upstream_commit }}
          restore-keys: dl-fanboy-
      - name: Restore feeds cache
        id: cache-feeds
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.BUILD_DIR }}/feeds
          # Date-suffixed to match build.yml: an exact hit only skips the
          # feeds update for same-day runs, keeping the snapshot fresh.
          key: feeds-fanboy-${{ steps.clone.outputs.upstream_commit }}-${{ steps.ci-hash.outputs.build_date }}
          restore-keys: |
            feeds-fanboy-${{ steps.clone.outputs.upstream_commit }}-
            feeds-fanboy-
      - name: Restore toolchain cache
        id: cache-tc
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.BUILD_DIR }}/staging_dir
            ${{ env.BUILD_DIR }}/build_dir/host
            ${{ env.BUILD_DIR }}/build_dir/toolchain-*
          key: toolchain-fanboy-${{ steps.clone.outputs.upstream_commit }}
          restore-keys: toolchain-fanboy-
      - name: Restore ccache
        id: cache-ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.BUILD_DIR }}/.ccache
          key: ccache-fanboy-${{ steps.clone.outputs.upstream_commit }}-${{ steps.ci-hash.outputs.ci_hash }}
          restore-keys: |
            ccache-fanboy-${{ steps.clone.outputs.upstream_commit }}-
            ccache-fanboy-
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential ninja-build meson \
            libelf-dev libssl-dev libncurses-dev zlib1g-dev gawk flex bison gettext \
            unzip file rsync git subversion swig ecj libtool-bin autoconf automake
      - name: Set up validation tree
        run: |
          FEEDS_FLAG=""
          if [ "${{ steps.cache-feeds.outputs.cache-hit }}" = "true" ]; then
            FEEDS_FLAG="--skip-feeds-update"
          fi
          bash ${{ env.CI_REPO }}/scripts/setup-validate-tree.sh \
            --existing $FEEDS_FLAG ${{ env.BUILD_DIR }} ${{ env.CI_REPO }}
      - name: Download sources
        run: |
          cd ${{ env.BUILD_DIR }}
          make download -j$(nproc)
      - name: Save dl cache
        continue-on-error: true
        if: success() && steps.cache-dl.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.BUILD_DIR }}/dl
          key: dl-fanboy-${{ steps.clone.outputs.upstream_commit }}
      - name: Build tools + toolchain
        if: steps.cache-tc.outputs.cache-hit != 'true'
        run: |
          cd ${{ env.BUILD_DIR }}
          make tools/install toolchain/install -j$(nproc) V=s 2>&1 | tail -30
      - name: Save toolchain cache
        continue-on-error: true
        if: success() && steps.cache-tc.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.BUILD_DIR }}/staging_dir
            ${{ env.BUILD_DIR }}/build_dir/host
            ${{ env.BUILD_DIR }}/build_dir/toolchain-*
          key: toolchain-fanboy-${{ steps.clone.outputs.upstream_commit }}
      - name: Apply candidates
        run: |
          bash ${{ env.CI_REPO }}/scripts/apply-candidates.sh \
            ${{ env.BUILD_DIR }} ${{ env.CI_REPO }}/docs/candidate-report.md
      - name: Run candidate preflight
        run: |
          bash ${{ env.CI_REPO }}/scripts/preflight-validate.sh \
            ${{ env.BUILD_DIR }} --mode=${{ inputs.mode || 'prepare' }} --skip-apply \
            --report=${{ env.CI_REPO }}/docs/candidate-preflight-report.md
      - name: Check ccache cache
        id: check-ccache
        if: success() && steps.cache-ccache.outputs.cache-hit != 'true'
        run: |
          set +e
          if [ -d "${{ env.BUILD_DIR }}/.ccache" ] && [ -n "$(find "${{ env.BUILD_DIR }}/.ccache" -mindepth 1 -print -quit)" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Save ccache
        continue-on-error: true
        if: success() && steps.cache-ccache.outputs.cache-hit != 'true' && steps.check-ccache.outputs.exists == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.BUILD_DIR }}/.ccache
          key: ccache-fanboy-${{ steps.clone.outputs.upstream_commit }}-${{ steps.ci-hash.outputs.ci_hash }}
      - name: Upload candidate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-report
          path: |
            ${{ env.CI_REPO }}/docs/candidate-report.md
            ${{ env.CI_REPO }}/docs/candidate-preflight-report.md
          if-no-files-found: warn
          retention-days: 7

  config:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout CI repo
        uses: actions/checkout@v4
        with:
          path: ci-repo
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential ninja-build meson \
            libelf-dev libssl-dev libncurses-dev zlib1g-dev gawk flex bison gettext \
            unzip file rsync git subversion swig ecj libtool-bin autoconf automake
      - name: Set up validation tree
        run: |
          bash ${{ env.CI_REPO }}/scripts/setup-validate-tree.sh ${{ env.BUILD_DIR }} ${{ env.CI_REPO }}
      - name: Verify config
        run: |
          grep "CONFIG_TARGET_airoha_an7581_DEVICE_econet_xr1710g-ubi=y" ${{ env.BUILD_DIR }}/.config
          grep "CONFIG_PACKAGE_luci-app-mlo=y" ${{ env.BUILD_DIR }}/.config
          grep "CONFIG_PACKAGE_luci-theme-glass=y" ${{ env.BUILD_DIR }}/.config
