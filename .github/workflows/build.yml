name: XR1710G Firmware CI

on:
  workflow_dispatch:
    inputs:
      build_dir_cache:
        description: Phase-2 build_dir/target incremental cache (tb/tp channels)
        required: false
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OW1700K_REPO: OpenWRT-fanboy/OpenW1700k
  OW1700K_BRANCH: ubi2-oc
  GLASS_REPO: rchen14b/luci-theme-glass
  GLASS_REF: v1.1.6
  BUILD_DIR: openwrt
  CI_REPO: ci-repo
  # Rollback switch: false restores the phase-1 behavior (34m floor).
  USE_BUILD_DIR_CACHE: ${{ inputs.build_dir_cache }}
  # 4G cap: standard runners have only ~14G free disk; a larger ccache
  # plus build_dir/staging_dir/dl would push the job off the disk.
  CCACHE_MAXSIZE: 4G
  CCACHE_COMPRESS: "1"
  # Fixed epoch for source-tree freezing + cache-tree mtime normalization
  # (see scripts/freeze-source-mtimes.sh): must be identical on EVERY run
  # so find_md5 (content+mtime) produces stable STAMP_PREPARED names.
  FREEZE_EPOCH: "1786062016"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    # actions:write is required for cache save/delete (prune-caches.sh);
    # contents:write for the release creation on tags. An explicit
    # permissions block resets unlisted scopes to none.
    permissions:
      actions: write
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout CI repo
        uses: actions/checkout@v4
        with:
          path: ci-repo

      - name: Compute CI content hash
        id: ci-hash
        run: |
          echo "ci_hash=$(bash ${{ env.CI_REPO }}/scripts/ci-content-hash.sh ${{ env.CI_REPO }})" >> $GITHUB_OUTPUT
          echo "build_date=$(date -u +%Y%m%d)" >> $GITHUB_OUTPUT

      - name: Clone locked fanboy ubi2-oc base
        id: clone
        run: |
          for i in 1 2 3 4 5; do
            if bash ${{ env.CI_REPO }}/scripts/clone-base.sh ${{ env.BUILD_DIR }}; then
              break
            fi
            echo "Clone attempt $i failed"
            rm -rf ${{ env.BUILD_DIR }}
            sleep 20
          done
          test -d ${{ env.BUILD_DIR }}
          echo "upstream_commit=$(git -C ${{ env.BUILD_DIR }} rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "Cloned upstream commit: $(git -C ${{ env.BUILD_DIR }} rev-parse HEAD)"

      - name: Prepare dl cache path
        run: |
          mkdir -p ${{ env.BUILD_DIR }}/dl

      - name: Restore dl cache
        id: cache-dl
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.BUILD_DIR }}/dl
          # Exact key is made unmatchable (ci_hash suffix) so restore ALWAYS
          # falls through to the prefix fallback, which returns the NEWEST
          # matching entry — the post-build save's complete, content-hashed
          # snapshot. A plain `dl-fanboy-<commit>` exact key would forever
          # hit the first (possibly tarball-incomplete) generation instead.
          key: dl-fanboy-${{ steps.clone.outputs.upstream_commit }}-${{ steps.ci-hash.outputs.ci_hash }}
          restore-keys: |
            dl-fanboy-${{ steps.clone.outputs.upstream_commit }}-
            dl-fanboy-

      - name: Prepare feeds cache path
        run: |
          mkdir -p ${{ env.BUILD_DIR }}/feeds

      - name: Restore feeds cache
        id: cache-feeds
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.BUILD_DIR }}/feeds
          # Date-suffixed: an exact hit only skips `feeds update -a` for
          # runs on the same day, so the feed snapshot refreshes at least
          # daily instead of freezing at the first run per base SHA.
          key: feeds-fanboy-${{ steps.clone.outputs.upstream_commit }}-${{ steps.ci-hash.outputs.build_date }}
          restore-keys: |
            feeds-fanboy-${{ steps.clone.outputs.upstream_commit }}-
            feeds-fanboy-

      - name: Restore toolchain cache
        id: cache-tc
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.BUILD_DIR }}/staging_dir
            ${{ env.BUILD_DIR }}/build_dir/host
            ${{ env.BUILD_DIR }}/build_dir/toolchain-*
          key: toolchain-fanboy-${{ steps.clone.outputs.upstream_commit }}
          restore-keys: |
            toolchain-fanboy-

      - name: Prepare ccache cache path
        run: |
          mkdir -p ${{ env.BUILD_DIR }}/.ccache

      - name: Restore ccache
        id: cache-ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.BUILD_DIR }}/.ccache
          # Keyed on base SHA + content hash of compile-relevant CI content:
          # same content reuses the exact entry (no save churn), changed
          # patches fall back to the previous content family via prefixes.
          key: ccache-fanboy-${{ steps.clone.outputs.upstream_commit }}-${{ steps.ci-hash.outputs.ci_hash }}
          restore-keys: |
            ccache-fanboy-${{ steps.clone.outputs.upstream_commit }}-
            ccache-fanboy-

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential ninja-build meson \
            libelf-dev libssl-dev libncurses-dev zlib1g-dev gawk flex bison gettext \
            unzip file rsync git subversion swig ecj libtool-bin autoconf automake

      - name: Apply XR1710G overlays
        run: |
          bash ${{ env.CI_REPO }}/apply-patches.sh ${{ env.BUILD_DIR }} ${{ env.CI_REPO }}

      - name: Clone luci-theme-glass
        run: |
          git clone --depth=1 --branch ${{ env.GLASS_REF }} \
            https://github.com/${{ env.GLASS_REPO }}.git \
            ${{ env.BUILD_DIR }}/package/luci-theme-glass

      - name: Update feeds
        if: steps.cache-feeds.outputs.cache-hit != 'true'
        run: |
          cd ${{ env.BUILD_DIR }}
          ./scripts/feeds update -a

      - name: Install feeds
        run: |
          cd ${{ env.BUILD_DIR }}
          ./scripts/feeds install -a

      - name: Check feeds cache
        id: check-feeds
        if: success() && steps.cache-feeds.outputs.cache-hit != 'true'
        run: |
          set +e
          if [ -d "${{ env.BUILD_DIR }}/feeds" ] && [ -n "$(find "${{ env.BUILD_DIR }}/feeds" -mindepth 1 -print -quit)" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save feeds cache
        if: success() && steps.cache-feeds.outputs.cache-hit != 'true' && steps.check-feeds.outputs.exists == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.BUILD_DIR }}/feeds
          key: feeds-fanboy-${{ steps.clone.outputs.upstream_commit }}-${{ steps.ci-hash.outputs.build_date }}

      - name: Configure
        run: |
          cd ${{ env.BUILD_DIR }}
          cp ../${{ env.CI_REPO }}/defconfig .config
          make defconfig

      - name: Verify config
        run: |
          grep "CONFIG_TARGET_airoha_an7581_DEVICE_econet_xr1710g-ubi=y" ${{ env.BUILD_DIR }}/.config \
            || { echo "FAIL: XR1710G device not selected"; exit 1; }
          grep "CONFIG_PACKAGE_luci-app-mlo=y" ${{ env.BUILD_DIR }}/.config \
            || { echo "FAIL: luci-app-mlo not selected"; exit 1; }
          grep "CONFIG_PACKAGE_luci-theme-glass=y" ${{ env.BUILD_DIR }}/.config \
            || { echo "FAIL: luci-theme-glass not selected"; exit 1; }

      - name: Download sources
        run: |
          cd ${{ env.BUILD_DIR }}
          for i in 1 2 3; do
            if make download -j$(nproc); then
              break
            fi
            echo "Download attempt $i failed"
            sleep 10
          done

      - name: Check dl cache
        # Runs unconditionally: the content-hashed save below must be able
        # to refresh the dl cache even when restore hit an old entry (old
        # entries can be missing tarballs; STAMP_PREPARED depends on
        # $(DL_DIR)/$(FILE), so a stale dl re-triggers package prepares).
        id: check-dl
        if: success()
        run: |
          set +e
          if [ -d "${{ env.BUILD_DIR }}/dl" ] && [ -n "$(find "${{ env.BUILD_DIR }}/dl" -mindepth 1 -print -quit)" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Freeze source tree mtimes
        # STAMP_PREPARED embeds find_md5, which hashes "%p%T@\n" — file
        # mtime INCLUDED (include/depends.mk). The package/kernel/tools
        # sources are re-cloned on every run, so their mtimes differ
        # between runs and the restored .prepared_<hash> stamps never match
        # the name make computes — every package re-extracts and rebuilds
        # (observed: warm run 14m55s, 258 package rebuilds, kernel too).
        # Freezing package/ feeds/ tools/ target/ to the same FIXED epoch
        # on every run (seed AND warm alike) makes find_md5 stable;
        # normalize_mtimes sets the cached trees to the same epoch, so
        # equal mtimes make make treat stamps as up-to-date.
        # UNCONDITIONAL: the seed run must freeze too, or its saved stamp
        # names won't match future warm runs.
        run: |
          bash ${{ env.CI_REPO }}/scripts/freeze-source-mtimes.sh ${{ env.BUILD_DIR }}

      - name: Compute build-dir cache keys
        # tb = kernel objtree (keyed on kernel-affecting hash), tp =
        # package dirs + staging (keyed on full content hash); both also
        # bound to glass HEAD so external input changes (tag force-push)
        # invalidate the tree. FREEZE_EPOCH is part of the key: STAMP_PREPARED
        # names embed find_md5 (content+mtime), so a different epoch yields
        # stamps that never match — binding it keeps generations cleanly
        # separated (actions/cache save refuses to overwrite an existing
        # key, so an epoch change must produce a NEW key).
        # Deliberately NOT keyed on the dl hash: `make download` mutates
        # dl/ on every run (tools/target tarballs re-fetched), so a dl hash
        # in the key would drift between runs and permanently miss
        # (observed: every run rebuilt 100% with 0 downloads). Same-version
        # republish is still caught by the validate fingerprint check on
        # the restored tree (prepare re-extracts => products differ => wipe).
        id: bdc-keys
        if: env.USE_BUILD_DIR_CACHE == 'true'
        run: |
          KHASH="$(bash ${{ env.CI_REPO }}/scripts/ci-content-hash.sh --kernel ${{ env.CI_REPO }})"
          GHASH="$(git -C ${{ env.BUILD_DIR }}/package/luci-theme-glass rev-parse HEAD)"
          echo "kernel_hash=$KHASH" >> "$GITHUB_OUTPUT"
          echo "tb_key=tb-${{ steps.clone.outputs.upstream_commit }}-$KHASH-$GHASH-$FREEZE_EPOCH" >> "$GITHUB_OUTPUT"
          echo "tp_key=tp-${{ steps.clone.outputs.upstream_commit }}-${{ steps.ci-hash.outputs.ci_hash }}-$GHASH-$FREEZE_EPOCH" >> "$GITHUB_OUTPUT"

      - name: Build tools + toolchain
        if: steps.cache-tc.outputs.cache-hit != 'true'
        run: |
          cd ${{ env.BUILD_DIR }}
          make tools/install toolchain/install -j$(nproc) V=s 2>&1 | tail -30

      - name: Run patch preflight
        # Runs on the COLD tree, BEFORE the build-dir restore: its prepare
        # targets re-extract + re-patch every package dir (STAMP_PREPARED
        # recipe starts with `rm -rf $(PKG_BUILD_DIR)`), which would destroy
        # a freshly restored cache tree. The restore below overwrites these
        # preflight dirs with the validated snapshot.
        run: |
          bash ${{ env.CI_REPO }}/scripts/preflight-validate.sh \
            ${{ env.BUILD_DIR }} --mode=prepare --skip-apply

      - name: Restore kernel build-dir cache
        id: cache-tb
        if: env.USE_BUILD_DIR_CACHE == 'true'
        uses: actions/cache/restore@v4
        with:
          # EXACT KEY ONLY: a fallback restore of a stale kernel tree would
          # be a wrong-build accident (unlike ccache, where a miss is the
          # worst case). Hash mismatch => cold build (phase-1 floor).
          path: |
            ${{ env.BUILD_DIR }}/build_dir/target-*/linux-*
            ${{ env.BUILD_DIR }}/build_dir/target-*/.ci-meta
          key: ${{ steps.bdc-keys.outputs.tb_key }}

      - name: Restore package build-dir cache
        id: cache-tp
        if: env.USE_BUILD_DIR_CACHE == 'true'
        uses: actions/cache/restore@v4
        with:
          # @actions/glob has no extglob, so the whole build_dir/target-*
          # (incl. the kernel objtree, also covered by tb) is the package
          # channel. Correctness is preserved by the key invariant (kernel
          # change => full hash change => tp misses) and the tb channel
          # independently keeps the kernel warm on package-only changes.
          path: |
            ${{ env.BUILD_DIR }}/build_dir/target-*
            ${{ env.BUILD_DIR }}/staging_dir/target-*
            ${{ env.BUILD_DIR }}/build_dir/target-*/.ci-meta
          key: ${{ steps.bdc-keys.outputs.tp_key }}

      - name: Validate build-dir cache
        # Marker + artifact-fingerprint checks; on mismatch the channels
        # are wiped (cold rebuild) with a loud warning, never silently used.
        # Also detects a saved freeze-epoch mismatch (stamps incompatible
        # with the current run's source mtimes) and outputs force_resave so
        # the save steps re-store the tree even on a cache-hit.
        id: validate-bd
        if: env.USE_BUILD_DIR_CACHE == 'true'
        run: |
          bash ${{ env.CI_REPO }}/scripts/builddir-cache.sh validate \
            ${{ env.BUILD_DIR }} \
            ${{ steps.bdc-keys.outputs.kernel_hash }} \
            ${{ steps.ci-hash.outputs.ci_hash }} \
            ${{ steps.cache-tb.outputs.cache-hit }} \
            ${{ steps.cache-tp.outputs.cache-hit }}

      - name: Collect CI metrics (pre-build)
        # After the toolchain step so the ccache binary (staging_dir/host)
        # exists on both cache-hit and cache-miss paths.
        run: |
          bash ${{ env.CI_REPO }}/scripts/ci-metrics.sh \
            ${{ env.BUILD_DIR }} /tmp/ci-metrics.md pre-build

      - name: Check toolchain cache
        id: check-tc
        if: success() && steps.cache-tc.outputs.cache-hit != 'true'
        run: |
          set +e
          if [ -d "${{ env.BUILD_DIR }}/staging_dir" ] \
            && [ -d "${{ env.BUILD_DIR }}/build_dir/host" ] \
            && ls -d "${{ env.BUILD_DIR }}"/build_dir/toolchain-* >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save toolchain cache
        if: success() && steps.cache-tc.outputs.cache-hit != 'true' && steps.check-tc.outputs.exists == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.BUILD_DIR }}/staging_dir
            ${{ env.BUILD_DIR }}/build_dir/host
            ${{ env.BUILD_DIR }}/build_dir/toolchain-*
          key: toolchain-fanboy-${{ steps.clone.outputs.upstream_commit }}

      - name: Full firmware build
        run: |
          cd ${{ env.BUILD_DIR }}
          make -k -j$(nproc) V=s > build.log 2>&1

      - name: Collect build failures
        if: always()
        run: |
          bash ${{ env.CI_REPO }}/scripts/collect-build-errors.sh \
            ${{ env.BUILD_DIR }}/build.log ${{ env.CI_REPO }}/docs/build-failures.md

      - name: Check ccache cache
        id: check-ccache
        if: success() && steps.cache-ccache.outputs.cache-hit != 'true'
        run: |
          set +e
          if [ -d "${{ env.BUILD_DIR }}/.ccache" ] && [ -n "$(find "${{ env.BUILD_DIR }}/.ccache" -mindepth 1 -print -quit)" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save ccache
        if: success() && steps.cache-ccache.outputs.cache-hit != 'true' && steps.check-ccache.outputs.exists == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.BUILD_DIR }}/.ccache
          key: ccache-fanboy-${{ steps.clone.outputs.upstream_commit }}-${{ steps.ci-hash.outputs.ci_hash }}

      - name: Check build-dir cache
        id: check-bd
        if: env.USE_BUILD_DIR_CACHE == 'true' && success()
        run: |
          set +e
          if ls -d ${{ env.BUILD_DIR }}/build_dir/target-*/linux-* >/dev/null 2>&1 \
             && ls -d ${{ env.BUILD_DIR }}/staging_dir/target-* >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare build-dir cache
        # Writes .ci-meta markers + per-channel artifact fingerprints inside
        # the cached paths (validated on the next run's restore).
        if: env.USE_BUILD_DIR_CACHE == 'true' && success() && steps.check-bd.outputs.exists == 'true'
        run: |
          bash ${{ env.CI_REPO }}/scripts/builddir-cache.sh prepare-save \
            ${{ env.BUILD_DIR }} \
            ${{ steps.bdc-keys.outputs.kernel_hash }} \
            ${{ steps.ci-hash.outputs.ci_hash }}

      - name: Save kernel build-dir cache
        if: env.USE_BUILD_DIR_CACHE == 'true' && success() && steps.check-bd.outputs.exists == 'true' && (steps.cache-tb.outputs.cache-hit != 'true' || steps.validate-bd.outputs.force_resave == 'true')
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.BUILD_DIR }}/build_dir/target-*/linux-*
            ${{ env.BUILD_DIR }}/build_dir/target-*/.ci-meta
          key: ${{ steps.bdc-keys.outputs.tb_key }}

      - name: Save package build-dir cache
        if: env.USE_BUILD_DIR_CACHE == 'true' && success() && steps.check-bd.outputs.exists == 'true' && (steps.cache-tp.outputs.cache-hit != 'true' || steps.validate-bd.outputs.force_resave == 'true')
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.BUILD_DIR }}/build_dir/target-*
            ${{ env.BUILD_DIR }}/staging_dir/target-*
            ${{ env.BUILD_DIR }}/build_dir/target-*/.ci-meta
          key: ${{ steps.bdc-keys.outputs.tp_key }}

      - name: Compute dl hash (post-build)
        # dl/ is now complete: feeds/packages tarballs that were missing
        # from the restored cache get downloaded during the build's prepare
        # phase (make download alone only fetches tools/target/luci), so
        # the pre-build hash is stale. Content-hashed key => a gap-filling
        # run stores a NEW entry (actions/cache never overwrites); the
        # restore prefix fallback picks the newest, complete one.
        id: dl-key-post
        if: success()
        run: |
          echo "dl_hash=$(bash ${{ env.CI_REPO }}/scripts/builddir-cache.sh dl-hash ${{ env.BUILD_DIR }}/dl)" >> "$GITHUB_OUTPUT"

      - name: Save dl cache (post-build)
        if: success() && steps.check-dl.outputs.exists == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.BUILD_DIR }}/dl
          key: dl-fanboy-${{ steps.clone.outputs.upstream_commit }}-${{ steps.dl-key-post.outputs.dl_hash }}

      - name: Kernel fingerprint canary
        # C1: compare the shipped kernel-1 sub-image against the previous
        # run; "kernel changed with same inputs" or "inputs changed with
        # same kernel" both warn loudly. Never fatal: a canary hiccup must
        # not block the cache saves below.
        if: env.USE_BUILD_DIR_CACHE == 'true' && success()
        continue-on-error: true
        run: |
          ITB="$(ls ${{ env.BUILD_DIR }}/bin/targets/airoha/an7581/*-sysupgrade.itb 2>/dev/null | head -1)"
          if [ -n "$ITB" ]; then
            bash ${{ env.CI_REPO }}/scripts/builddir-cache.sh kernel-fingerprint \
              "$ITB" ${{ steps.ci-hash.outputs.ci_hash }} ${{ steps.clone.outputs.upstream_commit }}
          else
            echo "No sysupgrade image produced — canary skipped"
          fi

      - name: Upload kernel fingerprint
        if: env.USE_BUILD_DIR_CACHE == 'true' && success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-fingerprint
          path: /tmp/kernel-fingerprint.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Collect CI metrics (post-build)
        if: always()
        run: |
          bash ${{ env.CI_REPO }}/scripts/ci-metrics.sh \
            ${{ env.BUILD_DIR }} /tmp/ci-metrics.md post-build

      - name: Prune stale caches
        # Keep the per-repo cache under the 10G limit so LRU eviction no
        # longer silently deletes the active branch's ccache/toolchain.
        if: always()
        continue-on-error: true
        run: |
          bash ${{ env.CI_REPO }}/scripts/prune-caches.sh

      - name: Upload CI metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-metrics
          path: /tmp/ci-metrics.md
          if-no-files-found: warn
          retention-days: 7

      - name: Surface build errors
        if: failure()
        run: |
          cd ${{ env.BUILD_DIR }}
          if [ -f build.log ]; then
            echo "=== Last 200 lines of build.log ==="
            tail -200 build.log
            echo "=== Error lines ==="
            grep -niE "error:|Error [0-9]|fatal:|FAILED|stop\.|No rule|No such file|Hunk.*FAILED|Patch failed" build.log | tail -80
          else
            echo "No build.log was produced; see validation reports."
          fi

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: |
            ${{ env.CI_REPO }}/docs/preflight-report.md
            ${{ env.CI_REPO }}/docs/build-failures.md
          if-no-files-found: warn
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ env.BUILD_DIR }}/build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xr1710g-firmware
          path: |
            ${{ env.BUILD_DIR }}/bin/targets/airoha/an7581/*.itb
            ${{ env.BUILD_DIR }}/bin/targets/airoha/an7581/*.bin
          if-no-files-found: warn

      - name: Create Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.BUILD_DIR }}/bin/targets/airoha/an7581/*.itb
            ${{ env.BUILD_DIR }}/bin/targets/airoha/an7581/*.bin
          tag_name: ${{ github.ref_name }}
          name: XR1710G Firmware ${{ github.ref_name }}
          body: |
            Automated XR1710G firmware build atop fanboy ubi2-oc.
            Upstream commit: ${{ steps.clone.outputs.upstream_commit }}
          draft: false
          prerelease: false
