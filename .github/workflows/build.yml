name: XR1710G Firmware CI

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OW1700K_REPO: OpenWRT-fanboy/OpenW1700k
  OW1700K_BRANCH: ubi2-oc
  GLASS_REPO: rchen14b/luci-theme-glass
  GLASS_REF: v1.1.6
  BUILD_DIR: openwrt
  CI_REPO: ci-repo
  CCACHE_MAXSIZE: 6G
  CCACHE_COMPRESS: "1"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout CI repo
        uses: actions/checkout@v4
        with:
          path: ci-repo

      - name: Clone locked fanboy offload base
        id: clone
        run: |
          for i in 1 2 3 4 5; do
            if bash ${{ env.CI_REPO }}/scripts/clone-base.sh ${{ env.BUILD_DIR }}; then
              break
            fi
            echo "Clone attempt $i failed"
            rm -rf ${{ env.BUILD_DIR }}
            sleep 20
          done
          test -d ${{ env.BUILD_DIR }}
          echo "upstream_commit=$(git -C ${{ env.BUILD_DIR }} rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "Cloned upstream commit: $(git -C ${{ env.BUILD_DIR }} rev-parse HEAD)"

      - name: Prepare dl cache path
        run: |
          mkdir -p ${{ env.BUILD_DIR }}/dl

      - name: Restore dl cache
        id: cache-dl
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.BUILD_DIR }}/dl
          key: dl-fanboy-${{ steps.clone.outputs.upstream_commit }}
          restore-keys: |
            dl-fanboy-

      - name: Prepare feeds cache path
        run: |
          mkdir -p ${{ env.BUILD_DIR }}/feeds

      - name: Restore feeds cache
        id: cache-feeds
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.BUILD_DIR }}/feeds
          key: feeds-fanboy-${{ steps.clone.outputs.upstream_commit }}
          restore-keys: |
            feeds-fanboy-

      - name: Restore toolchain cache
        id: cache-tc
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.BUILD_DIR }}/staging_dir
            ${{ env.BUILD_DIR }}/build_dir/host
            ${{ env.BUILD_DIR }}/build_dir/toolchain-*
          key: toolchain-fanboy-${{ steps.clone.outputs.upstream_commit }}
          restore-keys: |
            toolchain-fanboy-

      - name: Prepare ccache cache path
        run: |
          mkdir -p ${{ env.BUILD_DIR }}/.ccache

      - name: Restore ccache
        id: cache-ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.BUILD_DIR }}/.ccache
          key: ccache-fanboy-${{ steps.clone.outputs.upstream_commit }}
          restore-keys: |
            ccache-fanboy-

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential ninja-build meson \
            libelf-dev libssl-dev libncurses-dev zlib1g-dev gawk flex bison gettext \
            unzip file rsync git subversion swig ecj libtool-bin autoconf automake

      - name: Apply XR1710G overlays
        run: |
          bash ${{ env.CI_REPO }}/apply-patches.sh ${{ env.BUILD_DIR }} ${{ env.CI_REPO }}

      - name: Clone luci-theme-glass
        run: |
          git clone --depth=1 --branch ${{ env.GLASS_REF }} \
            https://github.com/${{ env.GLASS_REPO }}.git \
            ${{ env.BUILD_DIR }}/package/luci-theme-glass

      - name: Update feeds
        run: |
          cd ${{ env.BUILD_DIR }}
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Check feeds cache
        id: check-feeds
        if: success() && steps.cache-feeds.outputs.cache-hit != 'true'
        run: |
          set +e
          if [ -d "${{ env.BUILD_DIR }}/feeds" ] && [ -n "$(find "${{ env.BUILD_DIR }}/feeds" -mindepth 1 -print -quit)" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save feeds cache
        if: success() && steps.cache-feeds.outputs.cache-hit != 'true' && steps.check-feeds.outputs.exists == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.BUILD_DIR }}/feeds
          key: feeds-fanboy-${{ steps.clone.outputs.upstream_commit }}

      - name: Configure
        run: |
          cd ${{ env.BUILD_DIR }}
          cp ../${{ env.CI_REPO }}/defconfig .config
          make defconfig

      - name: Verify config
        run: |
          grep "CONFIG_TARGET_airoha_an7581_DEVICE_econet_xr1710g-ubi=y" ${{ env.BUILD_DIR }}/.config \
            || { echo "FAIL: XR1710G device not selected"; exit 1; }
          grep "CONFIG_PACKAGE_luci-app-mlo=y" ${{ env.BUILD_DIR }}/.config \
            || { echo "FAIL: luci-app-mlo not selected"; exit 1; }
          grep "CONFIG_PACKAGE_luci-theme-glass=y" ${{ env.BUILD_DIR }}/.config \
            || { echo "FAIL: luci-theme-glass not selected"; exit 1; }

      - name: Download sources
        run: |
          cd ${{ env.BUILD_DIR }}
          for i in 1 2 3; do
            if make download -j$(nproc); then
              break
            fi
            echo "Download attempt $i failed"
            sleep 10
          done

      - name: Check dl cache
        id: check-dl
        if: success() && steps.cache-dl.outputs.cache-hit != 'true'
        run: |
          set +e
          if [ -d "${{ env.BUILD_DIR }}/dl" ] && [ -n "$(find "${{ env.BUILD_DIR }}/dl" -mindepth 1 -print -quit)" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save dl cache
        if: success() && steps.cache-dl.outputs.cache-hit != 'true' && steps.check-dl.outputs.exists == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.BUILD_DIR }}/dl
          key: dl-fanboy-${{ steps.clone.outputs.upstream_commit }}

      - name: Build tools + toolchain
        if: steps.cache-tc.outputs.cache-hit != 'true'
        run: |
          cd ${{ env.BUILD_DIR }}
          make tools/install toolchain/install -j$(nproc) V=s 2>&1 | tail -30

      - name: Check toolchain cache
        id: check-tc
        if: success() && steps.cache-tc.outputs.cache-hit != 'true'
        run: |
          set +e
          if [ -d "${{ env.BUILD_DIR }}/staging_dir" ] \
            && [ -d "${{ env.BUILD_DIR }}/build_dir/host" ] \
            && ls -d "${{ env.BUILD_DIR }}"/build_dir/toolchain-* >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save toolchain cache
        if: success() && steps.cache-tc.outputs.cache-hit != 'true' && steps.check-tc.outputs.exists == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.BUILD_DIR }}/staging_dir
            ${{ env.BUILD_DIR }}/build_dir/host
            ${{ env.BUILD_DIR }}/build_dir/toolchain-*
          key: toolchain-fanboy-${{ steps.clone.outputs.upstream_commit }}

      - name: Run patch preflight
        run: |
          bash ${{ env.CI_REPO }}/scripts/preflight-validate.sh \
            ${{ env.BUILD_DIR }} --mode=prepare --skip-apply

      - name: Full firmware build
        run: |
          cd ${{ env.BUILD_DIR }}
          make -k -j$(nproc) V=s > build.log 2>&1

      - name: Collect build failures
        if: always()
        run: |
          bash ${{ env.CI_REPO }}/scripts/collect-build-errors.sh \
            ${{ env.BUILD_DIR }}/build.log ${{ env.CI_REPO }}/docs/build-failures.md

      - name: Check ccache cache
        id: check-ccache
        if: success() && steps.cache-ccache.outputs.cache-hit != 'true'
        run: |
          set +e
          if [ -d "${{ env.BUILD_DIR }}/.ccache" ] && [ -n "$(find "${{ env.BUILD_DIR }}/.ccache" -mindepth 1 -print -quit)" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save ccache
        if: success() && steps.cache-ccache.outputs.cache-hit != 'true' && steps.check-ccache.outputs.exists == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.BUILD_DIR }}/.ccache
          key: ccache-fanboy-${{ steps.clone.outputs.upstream_commit }}

      - name: Surface build errors
        if: failure()
        run: |
          cd ${{ env.BUILD_DIR }}
          if [ -f build.log ]; then
            echo "=== Last 200 lines of build.log ==="
            tail -200 build.log
            echo "=== Error lines ==="
            grep -niE "error:|Error [0-9]|fatal:|FAILED|stop\.|No rule|No such file|Hunk.*FAILED|Patch failed" build.log | tail -80
          else
            echo "No build.log was produced; see validation reports."
          fi

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: |
            ${{ env.CI_REPO }}/docs/preflight-report.md
            ${{ env.CI_REPO }}/docs/build-failures.md
          if-no-files-found: warn
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ env.BUILD_DIR }}/build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xr1710g-firmware
          path: |
            ${{ env.BUILD_DIR }}/bin/targets/airoha/an7581/*.itb
            ${{ env.BUILD_DIR }}/bin/targets/airoha/an7581/*.bin
          if-no-files-found: warn

      - name: Create Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.BUILD_DIR }}/bin/targets/airoha/an7581/*.itb
            ${{ env.BUILD_DIR }}/bin/targets/airoha/an7581/*.bin
          tag_name: ${{ github.ref_name }}
          name: XR1710G Firmware ${{ github.ref_name }}
          body: |
            Automated XR1710G firmware build atop fanboy offload.
            Upstream commit: ${{ steps.clone.outputs.upstream_commit }}
          draft: false
          prerelease: false
